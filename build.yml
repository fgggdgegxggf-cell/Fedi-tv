name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Find Project
        run: |
          echo "جاري فك ضغط الملف المضغوط..."
          unzip -q "*.zip" -d extracted_files || true
          ls -la extracted_files
          cd extracted_files/FEDI* 2>/dev/null || cd extracted_files/* 2>/dev/null || cd extracted_files

      - name: Build APK with Gradle
        run: |
          cd extracted_files/*/ 2>/dev/null || cd extracted_files/ 2>/dev/null || true
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/outputs/apk/debug/*.apk'
