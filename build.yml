name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP File
        run: |
          echo "جاري فك ضغط ملف التطبيق..."
          unzip -q FEDI_TV_PRO_Android_*.zip -d extracted_project
          ls -la extracted_project

      - name: Build APK with Gradle
        run: |
          cd extracted_project
          # البحث عن مجلد المشروع الداخلي وبناء الملف
          cd $(ls -d */|head -n 1)
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/outputs/apk/debug/*.apk'
