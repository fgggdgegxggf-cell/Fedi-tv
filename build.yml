name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          echo "جاري البحث عن ملف الـ ZIP وفك ضغطه..."
          unzip -q *.zip -d extracted_source || unzip -q FEDI_TV_PRO_Android_source.zip -d extracted_source
          ls -la extracted_source

      - name: Build APK with Gradle
        run: |
          cd extracted_source/* 2>/dev/null || cd extracted_source
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/outputs/apk/debug/*.apk'
