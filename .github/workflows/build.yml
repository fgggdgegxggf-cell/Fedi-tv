name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          # فك ضغط الملف المضغوط اللي رفعناه تلقائياً
          unzip FEDI_TV_PRO_Android_source.zip -d extracted_source || echo "الملف مفكوك مسبقاً أو غير موجود"

      - name: Build APK with Gradle
        run: |
          # الدخول للمجلد المستخرج وبدء البناء
          cd extracted_source/* || cd extracted_source
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/outputs/apk/debug/*.apk'
